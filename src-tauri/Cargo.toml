[package]
name = "tokenflow"
version = "0.1.0"
description = "Local-first desktop analytics for Ollama and DeepSeek usage"
authors = ["TokenFlow contributors"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
default-run = "tokenflow"

[lib]
name = "tokenflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
# Desktop shell
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + embedded HTTP proxy
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
] }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "http2",
] }

# Storage + time
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# Secret handling. `Zeroizing` wipes the key from memory on drop.
zeroize = "1"

# Diagnostics
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux tray integration. `ksni` implements StatusNotifierItem directly,
# including the `Activate` method that libayatana-appindicator does not expose.
# The icon is embedded as ARGB32 so the host panel never reads sandbox paths.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["blocking"] }
keyring = { version = "3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
] }

# macOS Keychain. Tauri is otherwise platform-neutral here.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "apple-native",
] }

# Windows Credential Manager.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "windows-native",
] }
