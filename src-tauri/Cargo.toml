[package]
name = "tokenflow"
version = "0.1.0+alpha.2"
description = "Local-first desktop analytics for Ollama and DeepSeek usage"
authors = ["Siddhesh Gunjal"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
default-run = "tokenflow"
repository = "https://github.com/siddheshgunjal/TokenFlow.git"
homepage = "https://token-flow.xyz/"
bugs = "https://github.com/siddheshgunjal/TokenFlow/issues"

[lib]
name = "tokenflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Installs a counting global allocator and logs core heap counters every 60s.
# Off by default: it adds two atomic operations to every allocation.
heap-stats = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
# Desktop shell
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# Must be registered before every other plugin so a second launch exits early.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + embedded HTTP proxy
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
] }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "http2",
] }

# Storage + time
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# Secret handling. `Zeroizing` wipes the key from memory on drop.
zeroize = "1"

# Diagnostics
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux tray integration. `ksni` implements StatusNotifierItem directly,
# including the `Activate` method that libayatana-appindicator does not expose.
# The icon is embedded as ARGB32 so the host panel never reads sandbox paths.
[target.'cfg(target_os = "linux")'.dependencies]
# Flatpak autostart uses the XDG Background portal; the portal is unavailable
# outside a sandbox, where the autostart plugin writes the XDG entry directly.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["blocking"] }
keyring = { version = "3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
] }
# Used only to call `WebViewExt::terminate_web_process`. wry's IPC handler
# keeps a strong reference cycle on the WebView, so the GObject is never
# finalized and its WebKitWebProcess outlives the closed window. This is the
# same crate/feature set Tauri already compiles, so it adds no new code.
webkit2gtk = { version = "2", features = ["v2_34"] }

# macOS Keychain. Tauri is otherwise platform-neutral here.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "apple-native",
] }

# Windows Credential Manager.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "windows-native",
] }
